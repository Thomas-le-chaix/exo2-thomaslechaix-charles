<div class="contact-wrapper">
  <div class="contact-card">
    <div class="contact-header">
      <h3 class="contact-title">Contactez-nous</h3>
    </div>

    <div class="contact-body">
      <form [formGroup]="contactForm" (ngSubmit)="onSubmit()">

        <div class="form-group">
          <label class="form-label" for="prenom">Prénom *</label>
          <input type="text" id="prenom" formControlName="prenom" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label" for="nom">Nom *</label>
          <input type="text" id="nom" formControlName="nom" class="form-input">
        </div>

        <div class="form-group">
          <label class="form-label" for="age">Âge</label>
          <input type="number" id="age" formControlName="age" class="form-input"
                 min="0" max="120"
                 (keydown)="bloquerTouches($event)">
        </div>

        <div class="switch-group">
          <input class="switch-input" type="checkbox" id="hideEmail" formControlName="hideEmail">
          <label class="switch-label" for="hideEmail">Cacher l'email</label>
        </div>

        @if (!contactForm.controls['hideEmail'].value) {
          <div class="form-group">
            <label class="form-label" for="email">Email *</label>
            <input type="email" id="email" formControlName="email" class="form-input">
          </div>
        }

        <div class="form-group form-group-last">
          <label class="form-label" for="commentaire">Commentaire *</label>
          <textarea id="commentaire" formControlName="commentaire" rows="4" class="form-textarea"></textarea>
        </div>

        <button type="submit" class="submit-btn" [disabled]="contactForm.invalid">
          Envoyer
        </button>
      </form>
    </div>
  </div>
</div>
