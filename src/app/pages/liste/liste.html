<div class="films-container">
  <h2 class="films-title">Ma Sélection de Films</h2>

  <div class="films-button-group">
    @for (film of films; track film.titre) {
      <button
        type="button"
        class="film-btn"
        [class.active]="filmSelectionne === film"
        (click)="selectionnerFilm(film)">
        {{ film.titre }}
      </button>
    }
  </div>

  @if (filmSelectionne) {
    <div class="film-card">
      <div class="film-card-body">
        <h4 class="film-card-title">{{ filmSelectionne.titre }}</h4>
      </div>
      <img [src]="filmSelectionne.affiche" class="film-card-img" [alt]="filmSelectionne.titre">
    </div>
  }
</div>
