<div class="result-wrapper">
  @if (dernierContact) {
    <div class="result-card">
      <div class="result-card-header">
        <h4 class="result-card-title">Dernier message reçu</h4>
      </div>
      <ul class="result-list">
        <li class="result-item"><strong>Prénom :</strong> {{ dernierContact.prenom }}</li>
        <li class="result-item"><strong>Nom :</strong> {{ dernierContact.nom }}</li>
        <li class="result-item"><strong>Âge :</strong> {{ dernierContact.age ?? 'Non renseigné' }}</li>
        <li class="result-item"><strong>Email :</strong> {{ dernierContact.email ?? 'Non renseigné' }}</li>
        <li class="result-item"><strong>Commentaire :</strong> {{ dernierContact.commentaire }}</li>
      </ul>
    </div>
  } @else {
    <app-not-found></app-not-found>
  }
</div>
